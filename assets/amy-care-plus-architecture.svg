<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title>Amy Wireless Care+ platform architecture</title>
<desc>Conceptual flow from policy issuance through claims, ledger, rates and financials.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B111E"/><stop offset="1" stop-color="#111927"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#005BAC"/><stop offset="1" stop-color="#1976C8"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F58220"/><stop offset="1" stop-color="#FF9A45"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".28"/></filter>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<text x="60" y="55" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">AMY WIRELESS CARE+</text>
<text x="60" y="82" fill="#94A3B8" font-family="Arial,sans-serif" font-size="14">Device protection &amp; extended warranty workflow</text>

<g filter="url(#shadow)">
 <rect x="55" y="135" width="190" height="105" rx="18" fill="#111927" stroke="#334155"/>
 <rect x="275" y="135" width="190" height="105" rx="18" fill="#111927" stroke="#334155"/>
 <rect x="495" y="135" width="190" height="105" rx="18" fill="#111927" stroke="#334155"/>
 <rect x="715" y="135" width="190" height="105" rx="18" fill="#111927" stroke="#334155"/>
 <rect x="935" y="135" width="210" height="105" rx="18" fill="#111927" stroke="#334155"/>
</g>

<g font-family="Arial,sans-serif" text-anchor="middle">
 <circle cx="95" cy="165" r="15" fill="url(#orange)"/><text x="95" y="170" fill="#fff" font-size="14" font-weight="700">1</text>
 <text x="150" y="171" fill="#fff" font-size="16" font-weight="700">Issue Policy</text>
 <text x="150" y="198" fill="#94A3B8" font-size="12">Customer + device</text>
 <text x="150" y="218" fill="#94A3B8" font-size="12">coverage selection</text>

 <circle cx="315" cy="165" r="15" fill="url(#blue)"/><text x="315" y="170" fill="#fff" font-size="14" font-weight="700">2</text>
 <text x="370" y="171" fill="#fff" font-size="16" font-weight="700">Claims</text>
 <text x="370" y="198" fill="#94A3B8" font-size="12">Lookup + adjudication</text>
 <text x="370" y="218" fill="#94A3B8" font-size="12">claim ledger</text>

 <circle cx="535" cy="165" r="15" fill="url(#blue)"/><text x="535" y="170" fill="#fff" font-size="14" font-weight="700">3</text>
 <text x="590" y="171" fill="#fff" font-size="16" font-weight="700">Ledger</text>
 <text x="590" y="198" fill="#94A3B8" font-size="12">Policy records</text>
 <text x="590" y="218" fill="#94A3B8" font-size="12">and transactions</text>

 <circle cx="755" cy="165" r="15" fill="url(#orange)"/><text x="755" y="170" fill="#fff" font-size="14" font-weight="700">4</text>
 <text x="810" y="171" fill="#fff" font-size="16" font-weight="700">Rates</text>
 <text x="810" y="198" fill="#94A3B8" font-size="12">Underwriting matrix</text>
 <text x="810" y="218" fill="#94A3B8" font-size="12">and pricing logic</text>

 <circle cx="975" cy="165" r="15" fill="url(#blue)"/><text x="975" y="170" fill="#fff" font-size="14" font-weight="700">5</text>
 <text x="1040" y="171" fill="#fff" font-size="16" font-weight="700">Financials</text>
 <text x="1040" y="198" fill="#94A3B8" font-size="12">Portfolio analytics</text>
 <text x="1040" y="218" fill="#94A3B8" font-size="12">and loss metrics</text>
</g>

<g stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round">
 <path d="M245 187h30"/><path d="M465 187h30"/><path d="M685 187h30"/><path d="M905 187h30"/>
</g>
<g fill="#94A3B8">
 <path d="M270 181l10 6-10 6z"/><path d="M490 181l10 6-10 6z"/><path d="M710 181l10 6-10 6z"/><path d="M930 181l10 6-10 6z"/>
</g>

<rect x="55" y="290" width="1090" height="76" rx="18" fill="#0F172A" stroke="#1E293B"/>
<text x="80" y="320" fill="#F58220" font-family="monospace" font-size="12" font-weight="700">PLATFORM</text>
<text x="80" y="346" fill="#CBD5E1" font-family="Arial,sans-serif" font-size="14">Single-page operational interface • responsive navigation • dynamic underwriting • policy &amp; claims workflows</text>
</svg>
